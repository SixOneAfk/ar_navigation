syntax = "proto3";

package positioning;

service PositioningService {
  rpc EstimatePosition (EstimatePositionRequest) returns (EstimatePositionResponse);
}

message BeaconRssi {
  string bssid = 1;
  int32 rssi = 2;
}

message CvMarker {
  string marker_id = 1;
  float confidence = 2;
}

message EstimatePositionRequest {
  string device_id = 1;
  int32 step_count = 2;
  double heading_deg = 3;
  repeated BeaconRssi wifi = 4;
  repeated CvMarker cv_markers = 5;
  string timestamp = 6;
}

message EstimatePositionResponse {
  double x = 1;
  double y = 2;
  double z = 3;
  double confidence = 4;
  string source = 5;
}
