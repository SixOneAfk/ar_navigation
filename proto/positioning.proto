syntax = "proto3";

package positioning;

service PositioningService {
  rpc EstimatePosition (EstimatePositionRequest) returns (EstimatePositionResponse);
}

message BeaconRssi {
  string bssid = 1;
  int32 rssi = 2;
}

message CvMarker {
  string marker_id = 1;
  float confidence = 2;
  double x = 3;
  double y = 4;
  double z = 5;
  int32 floor = 6;
}

message EstimatedPose {
  double x = 1;
  double y = 2;
  double z = 3;
  int32 floor = 4;
}

message EstimatePositionRequest {
  string device_id = 1;
  int32 step_count = 2;
  double heading_deg = 3;
  repeated BeaconRssi wifi = 4;
  repeated CvMarker cv_markers = 5;
  string timestamp = 6;
  EstimatedPose estimated_pose = 7;
  double pose_confidence = 8;
  string frame_id = 9;
  int64 sequence_number = 10;
  double velocity_hint_mps = 11;
  double device_pitch_deg = 12;
  double device_roll_deg = 13;
}

message EstimatePositionResponse {
  double x = 1;
  double y = 2;
  double z = 3;
  double confidence = 4;
  string source = 5;
  string correction_mode = 6;
  bool correction_applied = 7;
  string decision_reason = 8;
  double candidate_distance_m = 9;
}
